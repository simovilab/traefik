################################################################
# Global Configuration
################################################################
global:
  # Disable version check to keep logs clean in production.
  # Set to true in dev if you want Traefik to phone home for updates.
  checkNewVersion: false
  sendAnonymousUsage: false

################################################################
# API, Dashboard & Health
################################################################
api:
  dashboard: true
  insecure: false

# Enables the /ping endpoint used by the container healthcheck.
ping: {}

################################################################
# Entry Points
################################################################
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    # NOTE: default certResolver is set per-router via labels or via a
    # dynamic TLS options file. We avoid hardcoding wildcard domains here
    # because the default challenge is HTTP-01, which cannot issue
    # wildcard certificates. Enable DNS challenge + re-add `tls.domains`
    # only if you need wildcards.

  # MQTT over TLS — Traefik terminates TLS and forwards plain MQTT to the
  # backend broker. Routers are defined via Docker labels in compose.prod.yml.
  mqtt:
    address: ":8883"

################################################################
# Certificates Resolvers
#
# The `email` field is intentionally omitted here and provided via the
# TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL env var
# (see docker-compose.yml + .env.example).
################################################################
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      # For testing, point at the staging CA instead of defining a
      # second resolver (which would require another mounted storage
      # file):
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

      # HTTP Challenge (simple; requires port 80 reachable).
      httpChallenge:
        entryPoint: web

      # DNS Challenge (enables wildcard certificates).
      # Uncomment and configure for your DNS provider, then remove
      # the httpChallenge block above.
      # dnsChallenge:
      #   provider: cloudflare
      #   delayBeforeCheck: 30
      #   resolvers:
      #     - "1.1.1.1:53"
      #     - "8.8.8.8:53"

################################################################
# Providers
################################################################
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik_proxy
    watch: true

  file:
    directory: /config
    watch: true

################################################################
# Logging
################################################################
log:
  level: INFO
  filePath: /logs/traefik.log
  format: json

accessLog:
  filePath: /logs/access.log
  format: json
  # Keep access logs bounded; rotate externally (e.g. logrotate).
  bufferingSize: 100

################################################################
# Metrics
################################################################
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
    # Exposed on the default internal entrypoint; scrape via:
    #   docker exec traefik wget -qO- http://localhost:8080/metrics
