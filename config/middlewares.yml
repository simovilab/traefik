################################################################
# Middleware Configuration (Traefik v3)
################################################################

http:
  middlewares:
    # Security Headers
    # Notes:
    #   - sslRedirect / browserXssFilter / frameDeny were removed or
    #     deprecated in v3. HTTPS redirect is handled by the web
    #     entrypoint redirection in traefik.yml.
    #   - Only enable stsPreload after submitting your domain to
    #     https://hstspreload.org/ — it is hard to undo.
    security-headers:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: false
        stsSeconds: 31536000
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          Server: ""

    # Rate Limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

    # Compression
    compression:
      compress: true

    # IP Allow List Example (v3: ipAllowList; v2 ipWhiteList is deprecated)
    # ip-allowlist:
    #   ipAllowList:
    #     sourceRange:
    #       - "127.0.0.1/32"
    #       - "192.168.1.0/24"

    # CORS Headers Example
    # cors-headers:
    #   headers:
    #     accessControlAllowMethods:
    #       - GET
    #       - OPTIONS
    #       - PUT
    #       - POST
    #       - DELETE
    #     accessControlAllowOriginList:
    #       - https://example.com
    #     accessControlMaxAge: 100
    #     addVaryHeader: true

    # Redirect to WWW
    # redirect-to-www:
    #   redirectRegex:
    #     regex: "^https://(?:www\\.)?(.+)"
    #     replacement: "https://www.${1}"
    #     permanent: true

    # Strip WWW
    # strip-www:
    #   redirectRegex:
    #     regex: "^https://www\\.(.+)"
    #     replacement: "https://${1}"
    #     permanent: true
