# logrotate configuration for Traefik logs.
#
# Deploy this to the server at /etc/logrotate.d/traefik, or run manually:
#   logrotate -f /opt/traefik/logrotate.conf
#
# Traefik buffers writes (bufferingSize: 100), so we send SIGUSR1 to
# trigger a log file reopen after rotation (copytruncate is NOT used
# because it can lose buffered lines).

/opt/traefik/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        # Send SIGUSR1 to Traefik so it reopens the log files.
        docker kill --signal=SIGUSR1 traefik 2>/dev/null || true
    endscript
}
